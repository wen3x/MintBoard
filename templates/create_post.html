{% extends 'base.html' %}

{% block content %}
<div class="create-post-container">
    <div class="card">
        <h1 class="post-title" style="margin-bottom: 1.5rem;">Create New Post</h1>
        
        <form method="post" class="post-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_title" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Title</label>
                {{ form.title }}
                {% if form.title.errors %}
                    <div class="text-muted" style="color: #e74c3c; margin-top: 0.25rem;">{{ form.title.errors }}</div>
                {% endif %}
            </div>
            
            <div class="form-group" style="margin-top: 1rem;">
                <label for="id_description" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Content</label>
                {{ form.description }}
                {% if form.description.errors %}
                    <div class="text-muted" style="color: #e74c3c; margin-top: 0.25rem;">{{ form.description.errors }}</div>
                {% endif %}
            </div>
            
            <div class="form-actions" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn">Publish Post</button>
                <a href="{% url 'core:home' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
