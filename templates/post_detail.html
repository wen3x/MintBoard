{% extends 'base.html' %}

{% block content %}
<div class="post-detail-container">
    <div class="card post-card" id="post-{{ post.id }}">
        <div class="post-header">
            <h1 class="post-title">{{ post.title }}</h1>
            <div class="post-meta">
                <span>
                    <a href="{% url 'core:profile_detail' username=post.author.username %}" class="author-link">
                        {{ post.author.username }}
                    </a>
                </span>
                <span class="text-muted">{{ post.created_at|date:"F j, Y, g:i a" }}</span>
            </div>
        </div>

        <div class="post-body">
            <p class="post-description">{{ post.description }}</p>
        </div>

        <div class="post-actions">
            <div id="like-section">
                {% include "partials/like_button.html" with post=post liked=post.user_liked likes_count=post.likes_count %}
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a href="{% url 'core:home' %}" class="btn btn-outline">← Back</a>
    </div>
</div>
{% endblock %}
