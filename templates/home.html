{% extends "base.html" %}

{% block content %}
    <h1 style="margin-bottom: 1.5rem;">Recent Posts</h1>

    <div id="post-container">
        {% include "partials/post_list.html" with posts=posts %}
    </div>

    <div id="loading" class="text-center mt-3" style="display: none;">
        <span class="text-muted">Loading more posts...</span>
    </div>

    <div id="sentinel" 
         hx-get="{% url 'core:load_more_posts' %}?page=2" 
         hx-trigger="intersect" 
         hx-swap="beforeend" 
         hx-target="#post-container"
         hx-indicator="#loading"
         style="height: 1px; visibility: hidden;">
    </div>

    <script>
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'post-container') {
                const sentinel = document.getElementById('sentinel');
                let url = sentinel.getAttribute('hx-get');
                let pageMatch = url.match(/page=(\d+)/);
                if (pageMatch) {
                    let nextPage = parseInt(pageMatch[1]) + 1;
                    let newUrl = url.replace(/page=\d+/, 'page=' + nextPage);
                    sentinel.setAttribute('hx-get', newUrl);
                }
            }
        });
    </script>
{% endblock %}
