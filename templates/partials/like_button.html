<button type="button"
        class="btn btn-outline"
        style="padding: 0.25rem 0.75rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem;"
        hx-post="{% url 'core:like_post' post.id %}"
        hx-swap="outerHTML"
        hx-target="this"
        hx-trigger="click"
        hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="{% if liked %}var(--accent-color, #2ECC71){% else %}currentColor{% endif %}">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <span>{{ likes_count|default:0 }}</span>
</button>
