<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Чистая буква "M" по твоему наброску (Арч-стиль) -->
  <!-- Идём: левый верх -> центральный пик -> правый верх -> правое крыло вниз -> центральная нога вниз -> левое крыло вниз -->
  <path d="M 20 160 
           L 60 20 
           L 100 80 
           L 140 20 
           L 180 160 
           L 145 160 
           L 120 100 
           L 100 130 
           L 80 100 
           L 55 160 
           Z" 
        fill="#2ECC71" 
        stroke="#1A1A1A" 
        stroke-width="6" 
        stroke-linejoin="round"/>
</svg>